# Coverage is on for every `bun test` (locally, CI, nightly and release gate).
# The run FAILS when coverage drops below these thresholds.
[test]
preload = ["./tests/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 0.95, functions = 0.95 }
# Only this project's code counts: dependencies (even when linked from a local checkout, which
# Bun resolves to their real path outside node_modules) are not ours to cover.
coveragePathIgnorePatterns = ["**/node_modules/**", "**/arrow-resilience-kit/**"]
