# Coverage is on for every `bun test` (locally, CI, nightly and release gate).
# The run FAILS when coverage drops below these thresholds.
[test]
preload = ["./tests/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 0.95, functions = 0.95 }
# Only this project's code counts. (A dependency linked from a local checkout via `file:` resolves
# outside node_modules; add its path here while testing such a link.)
coveragePathIgnorePatterns = ["**/node_modules/**"]
